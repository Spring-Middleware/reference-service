rules:
  - name: catalog
    extractor-path: "$"

    extractor-rules:
      - json-data-types: [FIELD, META_DATA]
        name: catalogId
        extractor-path: "$.id"

      - json-data-types: [FIELD, META_DATA]
        name: catalogName
        extractor-path: "$.name"

      - json-data-types: [FIELD, META_DATA]
        name: catalogStatus
        extractor-path: "$.status"

      - json-data-types: [FIELD]
        name: catalogDescription
        extractor-path: "$.description"

    generation-text-rules:
      - template: "Catalog {catalogName} (id: {catalogId}) is {catalogStatus}."
        variables:
          catalogName: catalogName!
          catalogId: catalogId!
          catalogStatus: catalogStatus

      - template: "{catalogDescription}"
        variables:
          catalogDescription: catalogDescription

    children:
      - name: product
        extractor-path: "$.products[*]"
        inherit-metadata:
          - catalogName

        extractor-rules:
          - json-data-types: [FIELD, META_DATA]
            name: productId
            extractor-path: "$.id"

          - json-data-types: [FIELD, META_DATA]
            name: productName
            extractor-path: "$.name"

          - json-data-types: [FIELD, META_DATA]
            name: productType
            extractor-path: "$.productType"

          - json-data-types: [FIELD, META_DATA]
            name: productSku
            extractor-path: "$.sku"

          - json-data-types: [FIELD]
            name: priceAmount
            extractor-path: "$.price.amount"

          - json-data-types: [FIELD]
            name: priceCurrency
            extractor-path: "$.price.currency"

          - json-data-types: [FIELD]
            name: productDescription
            extractor-path: "$.description"

          - json-data-types: [ FIELD ]
            name: reviews
            extractor-path: "$.reviews[*]"
            transformation:
              name: expand
              parameters:
                template: "{comment} (rating: {rating}/5)"
                join-with: ", "

        generation-text-rules:
          - template: "Product {productName} (id: {productId}, sku: {productSku}) belongs to catalog {catalogName}."
            variables:
              productName: productName!
              productId: productId
              productSku: productSku
              catalogName: catalogName

          - template: "It is a {productType} product with price {priceAmount} {priceCurrency}."
            variables:
              productType: productType:"unknown"
              priceAmount: priceAmount!
              priceCurrency: priceCurrency!

          - template: "Description: {productDescription}"
            variables:
              productDescription: productDescription

          - template: "Customer reviews: {reviews}"
            variables:
              reviews: reviews

        children: []